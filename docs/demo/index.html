<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Way to Learn — demo</title>
<meta name="description" content="Demo of the write-ups, audio breakdown, notes and practice sheets this tool generates.">
<style>
  :root { color-scheme: dark light; --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22; --accent:#58a6ff; }
  :root:not([data-theme="dark"]) { @media (prefers-color-scheme: light) {
    --bg:#fff; --fg:#1f2328; --muted:#636c76; --line:#d0d7de; --card:#f6f8fa; --accent:#0969da; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem 1rem;
         background:var(--bg); color:var(--fg);
         font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif; }
  main { width:100%; max-width:30rem; text-align:center; }
  h1 { font-size:1.4rem; margin:0 0 .3rem; }
  p { color:var(--muted); margin:0 0 1.6rem; }
  ul { list-style:none; margin:0; padding:0; display:grid; gap:.7rem; }
  a { display:block; padding:.9rem 1.1rem; border:1px solid var(--line); border-radius:12px;
      background:var(--card); color:var(--fg); text-decoration:none; text-align:left; }
  a:hover { border-color:var(--accent); }
  a b { display:block; font-size:1.05rem; }
  a span { color:var(--muted); font-size:.88rem; }
  .note { margin:1.6rem 0 0; font-size:.85rem; }
</style>
</head>
<body>
<main>
  <h1>The Way to Learn</h1>
  <p>Pick a language for the demo.</p>
  <ul>
    <li><a href="en/" hreflang="en"><b>English</b><span>Analysed from the English transcript — write-up, notes, practice and audio all in English</span></a></li>
    <li><a href="zh-TW/" hreflang="zh-TW"><b>繁體中文</b><span>以中文字幕分析，解析、筆記、練習與語音全是中文</span></a></li>
  </ul>
  <p class="note">Redirecting to your browser's language in a moment…</p>
</main>
<script>
  /* 以英文為基底：瀏覽器偏好中文才送去 zh-TW，其餘一律 en。
     ?lang= 可以強制，#hash 原樣帶過去（例如 #<video_id> 直接開那一集）。 */
  (() => {
    const forced = new URLSearchParams(location.search).get("lang");
    const prefers = (navigator.languages || [navigator.language || "en"])
      .some((l) => /^zh\b/i.test(l) && !/^zh-(hans|cn|sg)/i.test(l));
    const to = forced === "zh-TW" || forced === "zh" ? "zh-TW/"
             : forced === "en" ? "en/"
             : prefers ? "zh-TW/" : "en/";
    location.replace(to + location.hash);
  })();
</script>
</body>
</html>
